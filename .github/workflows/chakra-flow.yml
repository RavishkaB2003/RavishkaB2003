name: Update Chakra Flow

on:
  push:
    branches:
      - main
      - profile-readme-redesign
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-chakra-flow
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Chakra Flow
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RavishkaB2003
          outputs: |
            assets/chakra-flow.svg?palette=github-light
            assets/chakra-flow-dark.svg?palette=github-dark

      - name: Commit generated flow
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/chakra-flow.svg assets/chakra-flow-dark.svg"
          message: "chore(profile): refresh chakra flow [skip ci]"
