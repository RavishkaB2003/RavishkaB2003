name: Update Profile Analytics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: RavishkaB2003
          output-dir: assets/profile-cards
          themes: dark
          cards: overview,contributions,repositories,languages
          commit: true
          commit-message: "chore(profile): refresh analytics cards [skip ci]"
